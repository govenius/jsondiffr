[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "jsondiffr"
dynamic = ["version"]
description = "Robust and stable diffs of pure JSON files (Python bindings)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "Joonas Govenius" }
]

keywords = ["json", "diff", "patch", "comparison"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/govenius/jsondiffr"
Repository = "https://github.com/govenius/jsondiffr"

[tool.maturin]
module-name = "jsondiffr"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
