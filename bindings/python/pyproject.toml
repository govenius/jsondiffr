[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "jsondiffr"
version = "0.1.0"
description = "Python bindings for the Rust jsondiffr patcher."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
module-name = "jsondiffr"
features = ["pyo3/extension-module"]
