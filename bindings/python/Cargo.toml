[package]
name = "jsondiffr-py"
version = "3.0.0"
edition = "2021"
description = "PyO3 bindings for the jsondiffr patcher and differ."

[lib]
name = "jsondiffr"
crate-type = ["cdylib"]

[dependencies]
jsondiffr = { path = "../../rust" }
serde_json = "1"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38"] }
